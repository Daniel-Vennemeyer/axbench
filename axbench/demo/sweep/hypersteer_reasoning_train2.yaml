train:
  model_name: "google/gemma-2-2b-it"
  layer: 20
  component: "res"
  seed: 42
  max_training_examples: 16000
  use_bf16: true
  output_length: 128
  models: 
    HyperSteer:
      batch_size: 12
      gradient_accumulation_steps: 1
      n_epochs: 10
      lr: 0.00008
      weight_decay: 0.00
      low_rank_dimension: 1
      intervention_positions: "all"
      intervention_type: "addition" # clamping
      binarize_dataset: false
      train_on_negative: false
      exclude_bos: true
      hypernet_name_or_path: "google/gemma-2-2b-it"
      num_hidden_layers: 4
      hypernet_initialize_from_pretrained: true
inference:
  mode: benchmark
  benchmark: gsm8k

  # REQUIRED for GSM8K
  model_name: google/gemma-2-2b-it
  seed: 42
  use_bf16: true
  mode: benchmark

  # Benchmark-specific
  benchmark_batch_size: 8
  max_questions: 10
  use_steering: false